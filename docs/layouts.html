<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>苗衣纪｜四页平面布局图</title>
    <style>
      :root {
        --ink: #112a2d;
        --paper: #f4efe3;
        --red: #b52d35;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 48px;
        color: var(--ink);
        background: var(--paper);
        font-family: "Microsoft YaHei", sans-serif;
      }
      header {
        max-width: 1200px;
        margin: 0 auto 36px;
      }
      h1 {
        font-family: SimSun, serif;
        font-size: 40px;
        margin: 0 0 8px;
      }
      p {
        color: #69706c;
      }
      .back {
        display: inline-block;
        margin-bottom: 24px;
        color: var(--red);
      }
      main {
        max-width: 1200px;
        margin: auto;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 28px;
      }
      figure {
        margin: 0;
        padding: 18px;
        background: #fff;
        border: 1px solid rgba(17, 42, 45, 0.18);
      }
      img {
        width: 100%;
        display: block;
      }
      figcaption {
        margin-top: 12px;
        font-weight: 700;
      }
      @media (max-width: 800px) {
        body {
          padding: 24px;
        }
        main {
          grid-template-columns: 1fr;
        }
      }
      @media print {
        body {
          padding: 0;
          background: #fff;
        }
        .back {
          display: none;
        }
        main {
          display: block;
        }
        figure {
          break-after: page;
          border: 0;
          padding: 0;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <a class="back" href="../index.html">← 返回网站首页</a>
      <h1>苗衣纪 · 网页平面布局图</h1>
      <p>
        四张布局图分别对应首页、历史与形制、纹样与配饰、文化传承页面。可使用浏览器打印为
        PDF 一并提交。
      </p>
    </header>
    <main>
      <figure>
        <img src="layout-home.svg" alt="首页平面布局图" />
        <figcaption>01 首页 / index.html</figcaption>
      </figure>
      <figure>
        <img src="layout-history.svg" alt="历史与形制页平面布局图" />
        <figcaption>02 历史与形制 / history.html</figcaption>
      </figure>
      <figure>
        <img src="layout-patterns.svg" alt="纹样与配饰页平面布局图" />
        <figcaption>03 纹样与配饰 / patterns.html</figcaption>
      </figure>
      <figure>
        <img src="layout-heritage.svg" alt="文化传承页平面布局图" />
        <figcaption>04 文化传承 / heritage.html</figcaption>
      </figure>
    </main>
  </body>
</html>
